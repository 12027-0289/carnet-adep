name = "carnet-adep"
pages_build_output_dir = "./public"
compatibility_date = "2025-09-01"

# Bases de datos D1 (gratis, sin tarjeta). "npm run configurar" las crea en Cloudflare
# y reemplaza estos IDs provisionales por los reales automáticamente.

# Datos: afiliados, filiales, carnets e intentos fallidos
[[d1_databases]]
binding = "DB"
database_name = "carnet-adep"
database_id = "00000000-0000-0000-0000-000000000001"

# Fotos, repartidas en 4 bases (cada base gratis admite 500 MB → ~60 000 fotos en total).
# Cada foto va a la base que le toca según su cédula (vea baseFotos en lib/comun.js).
[[d1_databases]]
binding = "FOTOS_1"
database_name = "carnet-adep-fotos-1"
database_id = "00000000-0000-0000-0000-000000000002"

[[d1_databases]]
binding = "FOTOS_2"
database_name = "carnet-adep-fotos-2"
database_id = "00000000-0000-0000-0000-000000000003"

[[d1_databases]]
binding = "FOTOS_3"
database_name = "carnet-adep-fotos-3"
database_id = "00000000-0000-0000-0000-000000000004"

[[d1_databases]]
binding = "FOTOS_4"
database_name = "carnet-adep-fotos-4"
database_id = "00000000-0000-0000-0000-000000000005"
